# aws-sdk-client-mock-jest's vitest shim imports chalk@5 (`new Chalk()`) but only
# declares chalk in its devDependencies, so it relied on a hoisted chalk@5 that
# graffle used to provide. Declare it as a real runtime dep so pnpm installs it.
packageExtensions:
  aws-sdk-client-mock-jest:
    dependencies:
      chalk: ^5.3.0
allowBuilds:
  aws-sdk: true
  esbuild: set this to true or false
  msw: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-dynamodb@3.1055.0'
  - '@aws-sdk/client-sqs@3.1055.0'
  - '@biomejs/biome@2.4.16'
  - '@biomejs/cli-darwin-arm64@2.4.16'
  - '@biomejs/cli-darwin-x64@2.4.16'
  - '@biomejs/cli-linux-arm64-musl@2.4.16'
  - '@biomejs/cli-linux-arm64@2.4.16'
  - '@biomejs/cli-linux-x64-musl@2.4.16'
  - '@biomejs/cli-linux-x64@2.4.16'
  - '@biomejs/cli-win32-arm64@2.4.16'
  - '@biomejs/cli-win32-x64@2.4.16'
